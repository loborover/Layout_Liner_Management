<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Liner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar" role="toolbar" aria-label="도구">
      <div class="group">
        <button data-tool="select" title="선택 (V)">선택</button>
        <button data-tool="line" title="선 (L)">선</button>
        <button data-tool="rect" title="사각형 (R)">사각형</button>
        <button data-tool="circle" title="원 (C)">원</button>
        <button data-tool="dimension" title="치수 (D)">치수</button>
      </div>
      <div class="group">
        <button data-tool="measure-distance" title="거리 측정 (M)">거리</button>
        <button data-tool="measure-angle" title="각도 측정 (N)">각도</button>
        <button data-tool="measure-area" title="면적 측정 (A)">면적</button>
      </div>
      <div class="group" aria-label="구속 (선택한 객체에 적용)">
        <button data-constraint="horizontal" title="수평 구속: 선택한 선">수평</button>
        <button data-constraint="vertical" title="수직 구속: 선택한 선">수직</button>
        <button data-constraint="parallel" title="평행 구속: 선 두 개">평행</button>
        <button data-constraint="perpendicular" title="직각 구속: 선 두 개">직각</button>
        <button data-constraint="equal" title="같은 길이/반지름: 선 또는 원 두 개 이상">동일</button>
        <button data-constraint="fixed" title="위치 고정: 선택한 객체의 점">고정</button>
        <button data-action="unconstrain" title="선택한 객체의 구속 해제">해제</button>
      </div>
      <div class="group">
        <button data-action="undo" title="실행 취소 (Ctrl+Z)">취소</button>
        <button data-action="redo" title="다시 실행 (Ctrl+Y)">다시</button>
        <button data-action="fit" title="전체 보기 (F)">전체 보기</button>
      </div>
      <div class="group">
        <button data-action="new" title="새 도면">새로</button>
        <button data-action="open" title="열기 (Ctrl+O)">열기</button>
        <button data-action="save" title="저장 (Ctrl+S)">저장</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </div>
      <div class="group">
        <label title="끝점·중점·중심·교차점·수직·사분점 (F3)"><input id="snap-object" type="checkbox" /> 객체 스냅</label>
        <label title="15° 단위 각도 추적, Shift: 수평/수직 고정 (F10)"><input id="snap-polar" type="checkbox" /> 각도 추적</label>
        <label title="그리드 스냅 (F9)"><input id="snap-grid" type="checkbox" /> 그리드</label>
        <label>
          단위
          <select id="unit">
            <option value="mm">mm</option>
            <option value="m">m</option>
          </select>
        </label>
      </div>
    </header>
    <main class="stage">
      <canvas id="canvas"></canvas>
    </main>
    <footer class="statusbar">
      <span id="status-hint"></span>
      <span id="status-msg" role="status"></span>
      <span class="spacer"></span>
      <span id="status-info"></span>
      <span id="status-pos"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
