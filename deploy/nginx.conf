server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Hashed build output never changes, so browsers may cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Source data links: /data/ goes to the read-only data gateway service (docs/DATA_SOURCES.md). The name is
    # resolved per request through Docker's DNS, so the editor still starts when the gateway is not running.
    location /data/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $data_gateway http://layout-liner-data:7840;
        rewrite ^/data/(.*)$ /$1 break;
        proxy_pass $data_gateway;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    # index.html must be revalidated so an updated image shows up on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
